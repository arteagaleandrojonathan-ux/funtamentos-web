<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/estilos-formularios.css">
</head>
<body>
  <form class="form">

    <div class="form-row">

        <div class="form-group">
            <label class="form-label" for="nombre">
                Nombre <span class="required">*</span>
            </label>

            <input
                id="nombre"
                type="text"
                class="form-control form-keyboard-active"
                placeholder="Ingrese su nombre"
                autocomplete="given-name"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="apellido">
                Apellido
            </label>

            <input
                id="apellido"
                type="text"
                class="form-control form-keyboard-active"
                placeholder="Ingrese su apellido"
                autocomplete="family-name"
            >
        </div>

    </div>

    <div class="form-group">
        <label class="form-label" for="tipo">
            Tipo
        </label>

        <select id="tipo" class="form-control form-select">
            <option value="">Seleccione una opción</option>
            <option value="1">Opción 1</option>
            <option value="2">Opción 2</option>
            <option value="3">Opción 3</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="descripcion">
            Descripción
        </label>

        <textarea
            id="descripcion"
            class="form-control"
            placeholder="Ingrese una descripción..."
        ></textarea>

        <span class="form-help">
            Máximo 500 caracteres.
        </span>
    </div>

    <div class="form-check">
        <input id="activo" type="checkbox">
        <label for="activo">Registro activo</label>
    </div>

    <div class="form-actions">
        <button
            type="button"
            class="btn btn-secondary"
        >
            Cancelar
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Guardar
        </button>
    </div>

</form>

</body>
</html>
